<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>听书知识库 · 资料导入</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            /* 科技感背景 */
            background-color: #1c1917;
            background-image: radial-gradient(circle at 15% 50%, rgba(245, 158, 11, 0.08) 0%, transparent 50%),
            radial-gradient(circle at 85% 30%, rgba(217, 119, 6, 0.08) 0%, transparent 50%),
            linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(41, 37, 34, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            color: #e7e5e4;
        }

        h1 {
            color: #fafaf9;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }

        .upload-area {
            border: 2px dashed rgba(245, 158, 11, 0.4);
            background: rgba(28, 25, 23, 0.4);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.05);
            box-shadow: inset 0 0 20px rgba(245, 158, 11, 0.1);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.5));
        }

        .upload-text {
            color: #a8a29e;
            font-size: 16px;
        }

        .file-input {
            display: none;
        }

        .file-list {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .file-item {
            background: rgba(28, 25, 23, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .file-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border-color: rgba(245, 158, 11, 0.3);
        }

        .file-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            margin-right: 20px;
        }

        .file-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .file-name {
            font-weight: 600;
            color: #f5f5f4;
            font-size: 16px;
        }

        .file-size {
            font-size: 13px;
            color: #78716c;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: white;
            min-width: 80px;
            text-align: center;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .status-uploading {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .status-processing {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        .status-completed {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .status-error {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .progress-wrapper {
            margin-top: 8px;
            display: none;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: rgba(28, 25, 23, 0.8);
            border-radius: 3px;
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 3px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.4s;
            position: relative;
            overflow: hidden;
        }

        .progress-bar::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0) 0%,
                    rgba(255, 255, 255, 0.2) 50%,
                    rgba(255, 255, 255, 0) 100%
            );
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        .progress-text {
            font-size: 12px;
            color: #a8a29e;
            margin-top: 6px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .log-details {
            margin-top: 15px;
            font-size: 13px;
            color: #d6d3d1;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .log-details summary {
            cursor: pointer;
            user-select: none;
            color: #a8a29e;
            outline: none;
            display: flex;
            align-items: center;
            font-weight: 500;
        }

        .log-details summary:hover {
            color: #f59e0b;
        }

        .log-details summary::marker {
            color: #78716c;
        }

        .log-list {
            margin: 12px 0 0 0;
            padding: 0;
            list-style: none;
            max-height: 150px;
            overflow-y: auto;
        }

        .log-list::-webkit-scrollbar {
            width: 6px;
        }

        .log-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
        }

        .log-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .log-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .log-list li {
            margin: 6px 0;
            line-height: 1.5;
            display: flex;
            align-items: center;
        }

        .log-list li::before {
            content: "•";
            color: #f59e0b;
            font-weight: bold;
            display: inline-block;
            width: 1em;
            margin-left: -1em;
            margin-right: 8px;
        }

        .log-done {
            color: #a7f3d0;
        }

        .log-done::before {
            content: "✓" !important;
            color: #10b981 !important;
        }

        .log-running {
            color: #fde68a;
            animation: pulseText 2s infinite;
        }

        .log-running::before {
            content: "↻" !important;
            color: #3b82f6 !important;
            animation: spin 2s linear infinite;
        }

        @keyframes pulseText {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎧 听书知识库 · 资料导入</h1>

    <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">📚</div>
        <div class="upload-text">点击或拖拽文件到此处（支持 PDF / MD / TXT / HTML / MP3）</div>
        <input type="file" id="fileInput" class="file-input"  accept=".pdf,.md,.txt,.html,.htm,.mp3">
    </div>

    <div class="meta-form" id="metaForm" style="margin-top:16px; display:grid; grid-template-columns:repeat(3,1fr); gap:10px;">
        <input type="text" id="metaBookName" placeholder="书名（可选，如：三体）" style="padding:8px;border:1px solid #44403c;border-radius:6px;background:#1c1917;color:#e7e5e4;">
        <input type="text" id="metaAuthorName" placeholder="作者名（可选，如：刘慈欣）" style="padding:8px;border:1px solid #44403c;border-radius:6px;background:#1c1917;color:#e7e5e4;">
        <input type="text" id="metaCategory" placeholder="类别/标签（可选，如：科幻）" style="padding:8px;border:1px solid #44403c;border-radius:6px;background:#1c1917;color:#e7e5e4;">
        <input type="text" id="metaEntryName" placeholder="条目名（可选，如：第1章 宇宙社会学）" style="padding:8px;border:1px solid #44403c;border-radius:6px;background:#1c1917;color:#e7e5e4;">
        <input type="text" id="metaAudioDuration" placeholder="有声书时长（可选，如：32小时）" style="padding:8px;border:1px solid #44403c;border-radius:6px;background:#1c1917;color:#e7e5e4;">
        <select id="metaContentType" style="padding:8px;border:1px solid #44403c;border-radius:6px;background:#1c1917;color:#a8a29e;">
            <option value="">内容类型（可选，自动识别）</option>
            <option value="有声书信息">有声书信息</option>
            <option value="书籍简介">书籍简介</option>
            <option value="作者介绍">作者介绍</option>
            <option value="听书笔记">听书笔记</option>
            <option value="推荐运营资料">推荐运营资料</option>
            <option value="用户评论摘要">用户评论摘要</option>
            <option value="常见问答">常见问答</option>
        </select>
        <input type="text" id="metaSourceUrl" placeholder="来源路径/资源链接（可选，如资料所在网页地址）" style="grid-column:1/-1;padding:8px;border:1px solid #44403c;border-radius:6px;background:#1c1917;color:#e7e5e4;">
    </div>
    <div style="margin-top:6px;font-size:12px;color:#a8a29e;">提示：以上信息可不填，系统会自动从文档内容中识别；内容类型仅支持下拉中的 7 种。</div>

    <div id="fileList" class="file-list">
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');

    // 简易 toast 提示（用于强校验失败等场景）
    function showToast(msg) {
        let toast = document.getElementById('import-toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'import-toast';
            toast.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;background:#7f1d1d;color:#fecaca;padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.4);max-width:80vw;transition:opacity .3s;';
            document.body.appendChild(toast);
        }
        toast.textContent = msg;
        toast.style.opacity = '1';
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, 3200);
    }

    // 模拟后端API地址
    const API_BASE = 'http://127.0.0.1:8000';

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#f59e0b';
        dropZone.style.background = 'rgba(245, 158, 11, 0.1)';
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '';
        dropZone.style.background = '';
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '';
        dropZone.style.background = '';
        handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
    });

    function handleFiles(files) {
        Array.from(files).forEach(uploadFile);
    }

    function updateProgressUI(wrapper, percentage) {
        const bar = wrapper.querySelector('.progress-bar');
        const text = wrapper.querySelector('.progress-text');

        const safePercentage = Math.min(Math.max(percentage, 0), 100);

        bar.style.width = safePercentage + '%';
        text.textContent = Math.round(safePercentage) + '%';

        if (safePercentage >= 100) {
            bar.style.background = 'linear-gradient(90deg, #10b981, #34d399)';
        } else if (safePercentage < 10) {
            bar.style.background = 'linear-gradient(90deg, #f59e0b, #fbbf24)';
        } else {
            bar.style.background = 'linear-gradient(90deg, #3b82f6, #60a5fa)';
        }
    }

    async function uploadFile(file) {
        // === 核心逻辑：按文件格式动态判断总节点数 ===
        // MD/TXT: entry -> md_img -> split -> 书名识别 -> 向量化 -> Milvus -> 知识图谱 = 7 步
        // PDF/HTML/MP3: 各自多一步格式转 Markdown 节点 = 8 步
        const lowerName = file.name.toLowerCase();
        // 0. 前端强校验：文件扩展名白名单（与后端支持格式一致）
        const allowedExts = ['.md', '.txt', '.pdf', '.html', '.htm', '.mp3'];
        if (!allowedExts.some(ext => lowerName.endsWith(ext))) {
            showToast(`不支持的文件格式：${file.name}（支持：${allowedExts.join(' / ')}）`);
            return;
        }
        // 0.1 内容类型白名单强校验（下拉之外再兜底校验一次）
        const contentTypeValue = document.getElementById('metaContentType').value;
        const allowedContentTypes = ['有声书信息', '书籍简介', '作者介绍', '听书笔记', '推荐运营资料', '用户评论摘要', '常见问答'];
        if (contentTypeValue && !allowedContentTypes.includes(contentTypeValue)) {
            showToast(`内容类型仅支持：${allowedContentTypes.join(' / ')}`);
            return;
        }
        const needConvert = lowerName.endsWith('.pdf')
            || lowerName.endsWith('.html')
            || lowerName.endsWith('.htm')
            || lowerName.endsWith('.mp3');
        const totalNodes = needConvert ? 8 : 7;

        const id = 'file-' + Math.random().toString(36).substr(2, 8);
        const html = `
            <div class="file-item" id="${id}">
                <div class="file-info">
                    <div class="file-header">
                        <span class="file-name">${file.name}</span>
                        <span class="file-size">${(file.size / 1024).toFixed(2)} KB</span>
                    </div>
                    <div class="progress-wrapper">
                        <div class="progress-bar-container">
                            <div class="progress-bar"></div>
                        </div>
                        <div class="progress-text">0%</div>
                    </div>
                    <details class="log-details" open>
                        <summary>准备上传...</summary>
                        <ul class="log-list"></ul>
                    </details>
                </div>
                <div class="status-badge status-uploading">上传中...</div>
            </div>
        `;
        fileList.insertAdjacentHTML('afterbegin', html);

        const itemEl = document.getElementById(id);
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressWrapper = itemEl.querySelector('.progress-wrapper');
        const logListEl = itemEl.querySelector('.log-list');

        const formData = new FormData();
        formData.append('file', file);
        // 附带用户显式填写的书籍元数据（可选，未填写则由后端 LLM 自动识别）
        const metaFields = {
            book_name: document.getElementById('metaBookName'),
            author_name: document.getElementById('metaAuthorName'),
            category: document.getElementById('metaCategory'),
            content_type: document.getElementById('metaContentType'),
            audio_duration: document.getElementById('metaAudioDuration'),
            entry_name: document.getElementById('metaEntryName'),
            source_url: document.getElementById('metaSourceUrl')
        };
        Object.entries(metaFields).forEach(([key, el]) => {
            if (el && el.value.trim()) formData.append(key, el.value.trim());
        });

        try {
            progressWrapper.style.display = 'block';

            // 使用动态的 totalNodes 计算基础上传进度
            const uploadPercentage = (1 / totalNodes) * 100;
            updateProgressUI(progressWrapper, Math.min(uploadPercentage, 10));

            const initialLog = document.createElement('li');
            initialLog.textContent = "开始上传文件...";
            initialLog.className = "log-running";
            logListEl.appendChild(initialLog);

            const response = await fetch(`${API_BASE}/upload`, {
                method: 'POST',
                body: formData
            });

            // 先解析响应体（可能带服务端校验错误信息 detail）
            const result = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(result.detail || `Upload failed (HTTP ${response.status})`);
            }
            const taskId = result.task_id;

            updateProgressUI(progressWrapper, uploadPercentage);
            statusBadge.textContent = '处理中';
            statusBadge.className = 'status-badge status-processing';

            // 把专属的 totalNodes 传给轮询函数
            pollStatus(taskId, itemEl, totalNodes);

        } catch (error) {
            console.error(error);
            statusBadge.textContent = '上传失败';
            statusBadge.className = 'status-badge status-error';
            updateProgressUI(progressWrapper, 0);

            const errLog = document.createElement('li');
            errLog.textContent = `❌ ${error.message || '网络请求失败或服务器异常'}`;
            errLog.style.color = "#ef4444";
            logListEl.appendChild(errLog);
        }
    }

    function normalizeLogText(text) {
        if (typeof text !== 'string') return String(text);
        return text;
    }

    // 接收 totalNodes 参数计算最终百分比和渲染文案
    function renderLogsAndCalculateProgress(itemEl, doneList, runningList, totalNodes) {
        const logSummary = itemEl.querySelector('.log-details summary');
        const logListEl = itemEl.querySelector('.log-list');

        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];

        // === 🚨 修复核心：调整进度计算逻辑 ===
        // 1. 直接使用 done.length，去掉多余的 +1
        let currentPercentage = (done.length / totalNodes) * 100;

        // 2. 平滑处理：如果有节点在运行，加半步的进度
        if (running.length > 0) {
            currentPercentage += (0.5 / totalNodes) * 100;
        }

        // 3. 进度条“锁死”机制：只要还没最终完成，最高只能显示 99%
        if (currentPercentage >= 100) {
            currentPercentage = 95;
        }
        // =====================================

        // 更新日志文案
        logSummary.textContent = `📋 运行日志 (已完成: ${done.length}, 进行中: ${running.length}, 共 ${totalNodes} 步)`;

        logListEl.innerHTML = '';

        const uploadLog = document.createElement('li');
        // uploadLog.textContent = "文件上传已完成";
        uploadLog.className = "log-done";
        logListEl.appendChild(uploadLog);

        for (const item of done) {
            // 过滤掉后端可能返回的 upload_file，防止和上面写死的那行日志重复
            if (item === 'upload_file') continue;

            const li = document.createElement('li');
            li.textContent = `${normalizeLogText(item)} 节点执行完成`;
            li.className = 'log-done';
            logListEl.appendChild(li);
        }

        for (const item of running) {
            const li = document.createElement('li');
            li.textContent = `正在处理 ${normalizeLogText(item)} 节点...`;
            li.className = 'log-running';
            logListEl.appendChild(li);
        }

        logListEl.scrollTop = logListEl.scrollHeight;

        return currentPercentage;
    }

    function pollStatus(taskId, itemEl, totalNodes) {
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressWrapper = itemEl.querySelector('.progress-wrapper');
        const logDetails = itemEl.querySelector('.log-details');

        const interval = setInterval(async () => {
            try {
                const res = await fetch(`${API_BASE}/status/${taskId}`);
                if (!res.ok) throw new Error('Status request failed');

                const data = await res.json();

                // 传入 totalNodes 继续计算
                const calculatedPercentage = renderLogsAndCalculateProgress(itemEl, data.done_list, data.running_list, totalNodes);

                if (data.status === 'completed') {
                    statusBadge.textContent = '已完成';
                    statusBadge.className = 'status-badge status-completed';
                    updateProgressUI(progressWrapper, 100);

                    setTimeout(() => {
                        logDetails.open = false;
                    }, 1000);
                    clearInterval(interval);
                } else if (data.status === 'processing') {
                    updateProgressUI(progressWrapper, calculatedPercentage);
                } else if (data.status === 'failed') {
                    statusBadge.textContent = '失败';
                    statusBadge.className = 'status-badge status-error';

                    const logListEl = itemEl.querySelector('.log-list');
                    const errLog = document.createElement('li');
                    errLog.textContent = "❌ 工作流执行失败中止";
                    errLog.style.color = "#ef4444";
                    logListEl.appendChild(errLog);

                    clearInterval(interval);
                }
            } catch (e) {
                console.error('Polling error', e);
            }
        }, 1500);
    }
</script>

</body>
</html>
